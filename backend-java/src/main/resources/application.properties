# ============================================================================
# FINSAFE JAVA SPRING BOOT CONFIGURATION
# Connected to Supabase PostgreSQL: zlpvkkccsfdlhypnmvc
# ============================================================================

server.port=8080

# ----------------------------------------------------------------------------
# 1. Supabase PostgreSQL Datasource
# Replace YOUR_SUPABASE_PASSWORD_HERE with your real Supabase database password,
# or set the SUPABASE_DB_PASSWORD environment variable.
# ----------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://db.zlpvkkccsfdlhypnmvc.supabase.co:5432/postgres?sslmode=require
spring.datasource.username=postgres
spring.datasource.password=${SUPABASE_DB_PASSWORD:YOUR_SUPABASE_PASSWORD_HERE}
spring.datasource.driver-class-name=org.postgresql.Driver

# ----------------------------------------------------------------------------
# 2. Hibernate / JPA Settings
# 'none' ensures Hibernate does not overwrite your Supabase schema
# ----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ----------------------------------------------------------------------------
# 3. Python AI Decision Service (FastAPI)
# ----------------------------------------------------------------------------
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# ----------------------------------------------------------------------------
# 4. JWT Security Configuration (24 hours expiration)
# ----------------------------------------------------------------------------
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration-ms=86400000

# ----------------------------------------------------------------------------
# 5. Logging Configuration
# ----------------------------------------------------------------------------
logging.level.com.finsafe=DEBUG
logging.level.org.springframework.security=INFO
